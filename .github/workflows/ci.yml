name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pg, POSTGRES_DB: rmf_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:pg@localhost:5432/rmf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt && playwright install --with-deps chromium
      - run: pytest
      - run: pytest -m e2e tests/e2e
      - name: migrations match models
        run: |
          export DATABASE_URL=$TEST_DATABASE_URL
          python -c "from app.db import engine; from app.models import Base; Base.metadata.drop_all(engine); engine.dispose()"
          alembic upgrade head && alembic check
